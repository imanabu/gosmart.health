{% load menu_tags %}
<ul class="navbar-nav ms-auto">
    {% for item in menu_items %}
        {% if item.has_children_in_menu %}
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle {% if item.active_class %}active{% endif %}"
               href="{{ item.href }}"
               role="button"
               data-bs-toggle="dropdown"
               aria-expanded="false">
                {{ item.text }}
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
                {% for child in item.children %}
                <li>
                    <a class="dropdown-item {% if child.active_class %}active{% endif %}"
                       href="{{ child.href }}">
                        {{ child.text }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </li>
        {% else %}
        <li class="nav-item">
            <a class="nav-link {% if item.active_class %}active{% endif %}"
               href="{{ item.href }}">
                {{ item.text }}
            </a>
        </li>
        {% endif %}
    {% endfor %}
</ul>
